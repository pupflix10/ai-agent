name: 🚀 AI Opportunity Hunter 24/7 Cloud Agent

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Opportunity Hunt Scan & Send Email Alerts
        env:
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_PASSWORD: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          python main.py --scan

      - name: Save Generated Dossiers & Persistent Deduplication History
        run: |
          git config --global user.name "AI Opportunity Hunter Agent"
          git config --global user.email "agent@antigravity.ai"
          git add processed_history.json dossiers/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Save processed opportunity history & dossiers" && git push) || true
